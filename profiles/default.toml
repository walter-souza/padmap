# Perfil de exemplo: movimentação estilo WASD.
# Botões usam nomes posicionais: south = A (Xbox) / Cruz (PS) / B (Nintendo).
name = "Padrão (WASD)"

[settings]
axis_threshold = 0.5
release_ratio = 0.8

[buttons]
south = "Space"
east = "LCtrl"
west = "R"
north = "E"
left_shoulder = "Q"
right_shoulder = "F"
back = "Tab"
start = "Escape"
left_stick = "LShift"
right_stick = "V"
dpad_up = "1"
dpad_right = "2"
dpad_down = "3"
dpad_left = "4"

# Sticks por ângulo: em graus, anti-horário a partir da direita (90 = cima).
# Cada setor vai do seu `start` até o `start` do próximo. `shared` faz setores
# vizinhos se sobreporem, então a diagonal aciona as duas teclas.
[sticks.left]
shared = true
sectors = [
    { start = 45.0, key = "W" },
    { start = 135.0, key = "A" },
    { start = 225.0, key = "S" },
    { start = 315.0, key = "D" },
]

[sticks.right]
shared = true
sectors = [
    { start = 45.0, key = "Up" },
    { start = 135.0, key = "Left" },
    { start = 225.0, key = "Down" },
    { start = 315.0, key = "Right" },
]

[axes.left_trigger]
positive = "LAlt"
threshold = 0.3

[axes.right_trigger]
positive = "Enter"
threshold = 0.3
