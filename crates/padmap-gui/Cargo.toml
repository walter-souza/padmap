[package]
name = "padmap-gui"
description = "Interface gráfica do padmap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "padmap"
path = "src/main.rs"

[dependencies]
padmap-core.workspace = true
padmap-input.workspace = true
padmap-output.workspace = true
log.workspace = true
env_logger = "0.11"
# `persistence` guarda o tema escolhido entre uma execução e outra.
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17"
trash = "5.2"
